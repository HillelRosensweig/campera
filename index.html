<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Party Booth</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, sans-serif; }
    [hidden] { display: none !important; }
    section { height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; }
    form { display: contents; }
    button, .button { font-size: 1.1rem; padding: 0.8rem 1.6rem; border-radius: 2rem; border: 0; background: #fff; color: #000; cursor: pointer; }
    #name, #slogan { width: min(70vw, 18rem); font-size: 1.1rem; padding: 0.6rem 1rem; border-radius: 2rem; border: 0; text-align: center; }
    #error { color: #ff6b6b; white-space: pre-wrap; overflow-wrap: anywhere; padding: 0 1rem; }
    .spinner { width: 3rem; height: 3rem; border: 4px solid #fff4; border-top-color: #fff; border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #photo { max-height: 85dvh; max-width: 100vw; }
    #version { position: fixed; bottom: 0.5rem; margin: 0; font-size: 0.75rem; opacity: 0.5; }
  </style>
</head>
<body>
  <section data-screen="name">
    <p dir="rtl">כיתבו את שמכם וביחרו סיסמת בחירות</p>
    <form id="name-form">
      <input id="name" type="text" dir="rtl" placeholder="שם" autocomplete="off" aria-label="שם">
      <select id="slogan" dir="rtl" aria-label="סלוגן">
        <option value="">אקראי</option>
      </select>
      <button type="submit">Next</button>
    </form>
    <p id="version"></p>
  </section>
  <section data-screen="selfie" hidden>
    <label class="button">
      Take selfie
      <input id="selfie" type="file" accept="image/*" capture="user" hidden>
    </label>
    <p id="error"></p>
  </section>
  <section data-screen="waiting" hidden>
    <div class="spinner" aria-label="Processing"></div>
  </section>
  <section data-screen="result" hidden>
    <img id="photo" alt="Your photo">
    <button id="share">Share</button>
    <button id="retake">Retake</button>
  </section>
  <script type="module" src="src/main.js"></script>
</body>
</html>
