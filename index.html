<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Party Booth</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: system-ui, sans-serif; }
    #stage { position: relative; height: 100dvh; display: flex; justify-content: center; }
    canvas#view { height: 100dvh; aspect-ratio: 9 / 16; max-width: 100vw; object-fit: contain; }
    video { display: none; }
    button { font-size: 1.1rem; padding: 0.8rem 1.6rem; border-radius: 2rem; border: 0; }
    #start { position: absolute; top: 45%; }
    #shutter { position: absolute; bottom: 4vh; width: 4.5rem; height: 4.5rem; padding: 0; border-radius: 50%; border: 4px solid #fff; background: #ff3b6b; display: none; }
    #debug { position: absolute; top: 0.5rem; left: 0.5rem; font: 12px monospace; background: #0008; padding: 0.2rem 0.4rem; }
    #result { position: absolute; inset: 0; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; }
    #result img { max-height: 85dvh; max-width: 100vw; }
  </style>
</head>
<body>
  <div id="stage">
    <video id="camera" playsinline muted></video>
    <canvas id="view"></canvas>
    <button id="start">Start camera</button>
    <button id="shutter" aria-label="Take photo"></button>
    <div id="debug"></div>
    <div id="result">
      <img id="photo" alt="Your photo">
      <button id="retake">Retake</button>
    </div>
  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
